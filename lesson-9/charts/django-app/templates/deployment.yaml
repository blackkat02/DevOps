apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "django-app.fullname" . }}
spec:
{{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicaCount }}
{{- end }}
  selector:
    matchLabels:
      app: django
  template:
    metadata:
      labels:
        app: django
    spec:
      containers:
        - name: django
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}

          envFrom:
            - configMapRef:
                name: {{ include "django-app.fullname" . }}-config
            - secretRef:
                name: {{ include "django-app.fullname" . }}-secrets

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          startupProbe:
            httpGet:
              path: /admin/login/
              port: {{ .Values.service.targetPort }}
            failureThreshold: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /admin/login/
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 20
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /admin/login/
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 10