replicaCount: 2

image:
  repository: "<AWS_ACCOUNT_ID>.dkr.ecr.us-west-2.amazonaws.com/lesson-9-ecr"
  tag: "v1.0.17"
  pullPolicy: Always

service:
  type: LoadBalancer
  port: 80
  targetPort: 8000

config:
  ALLOWED_HOSTS: "*"
  DEBUG: "True"
  POSTGRES_DB: "django_db"
  POSTGRES_USER: "db_user"
  POSTGRES_HOST: "db-service-placeholder" # Завтра замінимо на реальний сервіс БД
  POSTGRES_PORT: "5432"

secrets:
  POSTGRES_PASSWORD: "my_simple_password_123"
  SECRET_KEY: "django-insecure-test-key-for-lesson7"

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70